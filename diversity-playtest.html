<script type="module">
const ColorEngine=(()=>{
/**
 * CG-COLOR-SYNTH-1: Pure rule engine for "Polarized Filters & Color Synthesis"
 * (偏振光栅与原色加色合成调车场).
 *
 * Rules:
 * 1. Two boards receive synchronized direction input (default: identity).
 * 2. Tiles:
 *    - '#' Wall (blocks all)
 *    - ' ' Floor
 *    - '.' Universal Goal
 *    - 'r' Red Polarization Gate (allows player and Red box; blocks Blue, Purple & Neutral)
 *    - 'b' Blue Polarization Gate (allows player and Blue box; blocks Red, Purple & Neutral)
 *    - 'p' Purple Polarization Gate (allows player and Purple box; blocks Red, Blue & Neutral)
 * 3. Entities:
 *    - '@' Player on floor, '+' Player on goal
 *    - '$' Neutral box on floor, '*' Neutral box on goal
 *    - 'R' Red box on floor, '1' Red box on goal
 *    - 'B' Blue box on floor, '2' Blue box on goal
 *    - 'P' Purple box on floor, '3' Purple box on goal
 * 4. Movement:
 *    - Player is neutral white light and can pass freely through all gates ('r', 'b', 'p') and floor.
 *    - Normal push: pushing a box into an empty floor/goal or matching gate moves the box by 1 step.
 *    - Non-matching gate push: attempting to push a box into a mismatching gate is blocked like a wall.
 * 5. Collision Synthesis (对撞加色合成 RED ⊗ BLUE => PURPLE):
 *    - When player pushes a box of color K1 into a cell containing a box of color K2:
 *      If {K1, K2} === {'red', 'blue'} and target cell is not a Red/Blue gate:
 *        Synthesis occurs!
 *        The two boxes merge into a single 'purple' box residing at the target cell.
 *        The pushing box is consumed (net box count -1).
 *        The player advances into the vacated space.
 *      Otherwise (e.g. Red into Red, Blue into Blue, or into Purple): blocked like normal Sokoban.
 * 6. Changes commit discretely at end of step. Undo fully restores box identities and colors.
 * 7. Solved: All goals covered by valid boxes.
 */

const DIRS = ['U', 'D', 'L', 'R'];
const MAPS = { identity: [0, 1, 2, 3], vertical: [0, 1, 3, 2], slash: [3, 2, 0, 1] };
const VECTORS = [[0, -1], [0, 1], [-1, 0], [1, 0]];

const COLOR_NEUTRAL = 0;
const COLOR_RED = 1;
const COLOR_BLUE = 2;
const COLOR_PURPLE = 3;

const COLOR_NAMES = {
  [COLOR_NEUTRAL]: 'neutral',
  [COLOR_RED]: 'red',
  [COLOR_BLUE]: 'blue',
  [COLOR_PURPLE]: 'purple'
};

const COLOR_CHARS = {
  neutral: '$',
  red: 'R',
  blue: 'B',
  purple: 'P'
};

const TILE_PRISM = '^';
const TILE_PRISM_UNICODE = '▲';
const TILE_CONDUIT = 'c';
const TILE_CONDUIT_UPPER = 'C';

function gateAllowsColor(gateType, boxColor) {
  if (!gateType) return true; // normal floor
  if (gateType === 'r') return boxColor === COLOR_RED;
  if (gateType === 'b') return boxColor === COLOR_BLUE;
  if (gateType === 'p') return boxColor === COLOR_PURPLE;
  return false;
}

function compile(level) {
  if (level.ruleVersion !== 'CG-COLOR-SYNTH-1') {
    throw Error('Invalid CG-COLOR-SYNTH-1 configuration');
  }

  const rawBoards = level.boards || (level.board0 && level.board1 ? [level.board0, level.board1] : null);
  if (!Array.isArray(rawBoards) || rawBoards.length !== 2 || !Object.hasOwn(MAPS, level.mapping || 'identity')) {
    throw Error('Invalid CG-COLOR-SYNTH-1 configuration');
  }

  const mappingKey = level.mapping || 'identity';
  let nextBoxId = 1;

  const boards = rawBoards.map((rawRows, side) => {
    if (!Array.isArray(rawRows) || !rawRows.length || typeof rawRows[0] !== 'string') {
      throw Error(`Invalid row array for board ${side}`);
    }
    const width = Math.max(...rawRows.map(r => r.length));
    const rows = rawRows.map(r => r.padEnd(width, ' '));
    const height = rows.length;
    const floor = [];
    const goals = [];
    const gates = {}; // pos -> 'r' | 'b' | 'p'
    const prisms = new Set();
    const conduitPositions = [];
    const initialBoxes = [];
    let player;

    // Detect exterior void cells by flood-filling from grid boundaries containing ' '
    const exteriorVoid = new Set();
    const voidQueue = [];
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (x === 0 || y === 0 || x === width - 1 || y === height - 1) {
          if (rows[y][x] === ' ') {
            const p = y * width + x;
            exteriorVoid.add(p);
            voidQueue.push([x, y]);
          }
        }
      }
    }
    while (voidQueue.length > 0) {
      const [vx, vy] = voidQueue.shift();
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        const nx = vx + dx;
        const ny = vy + dy;
        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
          if (rows[ny][nx] === ' ') {
            const np = ny * width + nx;
            if (!exteriorVoid.has(np)) {
              exteriorVoid.add(np);
              voidQueue.push([nx, ny]);
            }
          }
        }
      }
    }

    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      const validChars = '# .@+$*rbpRBPR123^▲cC';
      if (!validChars.includes(ch)) {
        throw Error(`Invalid tile '${ch}' at board ${side} (${x},${y})`);
      }
      if (ch === '#') return;
      const pos = y * width + x;
      // Exterior spaces are empty void and must NOT be added to board.floor
      if (ch === ' ' && exteriorVoid.has(pos)) return;
      floor.push(pos);

      // Prisms
      if (ch === '^' || ch === '▲') {
        prisms.add(pos);
      }

      // Conduits
      if (ch === 'c' || ch === 'C') {
        conduitPositions.push(pos);
      }

      // Gates
      if ('rbp'.includes(ch)) {
        gates[pos] = ch;
      }

      // Goals
      if ('.+*123'.includes(ch)) {
        goals.push(pos);
      }

      // Player
      if ('@+'.includes(ch)) {
        if (player !== undefined) throw Error(`Multiple players on board ${side}`);
        player = pos;
      }

      // Boxes
      if (ch === '$' || ch === '*') {
        initialBoxes.push({ id: nextBoxId++, pos, color: COLOR_NEUTRAL });
      } else if (ch === 'R' || ch === '1') {
        initialBoxes.push({ id: nextBoxId++, pos, color: COLOR_RED });
      } else if (ch === 'B' || ch === '2') {
        initialBoxes.push({ id: nextBoxId++, pos, color: COLOR_BLUE });
      } else if (ch === 'P' || ch === '3') {
        initialBoxes.push({ id: nextBoxId++, pos, color: COLOR_PURPLE });
      }
    }));

    if (player === undefined) {
      if (side === 0) throw Error(`Board ${side} requires a player`);
      player = -1;
    }

    const floorSet = new Set(floor);
    const neighbors = {};
    for (const pos of floor) {
      neighbors[pos] = VECTORS.map(([dx, dy]) => {
        const x = (pos % width) + dx, y = Math.floor(pos / width) + dy;
        const q = y * width + x;
        return x >= 0 && x < width && y >= 0 && y < height && floorSet.has(q) ? q : -1;
      });
    }

    initialBoxes.sort((a, b) => a.pos - b.pos);

    const conduitsMap = new Map();
    conduitPositions.forEach((p, idx) => { conduitsMap[idx] = p; });
    Object.defineProperty(conduitsMap, 'length', { get() { return this.size; } });

    return {
      width,
      height,
      floor,
      floorSet,
      goals,
      gates,
      prisms,
      conduits: conduitsMap,
      conduitPositions,
      neighbors,
      initial: {
        player,
        boxes: initialBoxes
      }
    };
  });

  // Build conduit pairings
  const conduitDefs = [];
  if (Array.isArray(level.conduits) && level.conduits.length > 0) {
    for (const c of level.conduits) {
      const sideA = c.a?.side ?? 0;
      const sideB = c.b?.side ?? 1;
      const bA = boards[sideA];
      const bB = boards[sideB];
      const posA = c.a.pos !== undefined ? c.a.pos : (c.a.y * bA.width + c.a.x);
      const posB = c.b.pos !== undefined ? c.b.pos : (c.b.y * bB.width + c.b.x);
      const outputSide = c.outputSide ?? 0;
      conduitDefs.push({
        a: { side: sideA, pos: posA, x: posA % bA.width, y: Math.floor(posA / bA.width) },
        b: { side: sideB, pos: posB, x: posB % bB.width, y: Math.floor(posB / bB.width) },
        outputSide
      });
    }
  } else if (boards[0].conduitPositions.length === 1 && boards[1].conduitPositions.length === 1) {
    const posA = boards[0].conduitPositions[0];
    const posB = boards[1].conduitPositions[0];
    conduitDefs.push({
      a: { side: 0, pos: posA, x: posA % boards[0].width, y: Math.floor(posA / boards[0].width) },
      b: { side: 1, pos: posB, x: posB % boards[1].width, y: Math.floor(posB / boards[1].width) },
      outputSide: 0
    });
  }

  for (const c of conduitDefs) {
    const linkA = { side: c.a.side, pos: c.a.pos, otherSide: c.b.side, otherPos: c.b.pos, outputSide: c.outputSide };
    const linkB = { side: c.b.side, pos: c.b.pos, otherSide: c.a.side, otherPos: c.a.pos, outputSide: c.outputSide };
    boards[c.a.side].conduits.set(c.a.pos, linkA);
    boards[c.a.side].conduits[c.a.pos] = linkA;
    boards[c.b.side].conduits.set(c.b.pos, linkB);
    boards[c.b.side].conduits[c.b.pos] = linkB;
  }

  const totalGoals = boards[0].goals.length + boards[1].goals.length;
  const initialBoxCount = boards[0].initial.boxes.length + boards[1].initial.boxes.length;
  const totalPrisms = boards[0].prisms.size + boards[1].prisms.size;
  const totalConduits = boards[0].conduitPositions.length + boards[1].conduitPositions.length;

  if (totalPrisms === 0 && totalConduits === 0 && initialBoxCount < totalGoals) {
    throw Error(`Initial boxes (${initialBoxCount}) cannot be less than total goals (${totalGoals})`);
  }

  return {
    ruleVersion: 'CG-COLOR-SYNTH-1',
    title: level.title || '',
    width: Math.max(boards[0].width, boards[1].width),
    height: Math.max(boards[0].height, boards[1].height),
    mapping: MAPS[mappingKey],
    mappingKey,
    boards,
    conduits: conduitDefs,
    conduitMap: [boards[0].conduits, boards[1].conduits],
    totalGoals,
    initial: {
      worlds: [
        { player: boards[0].initial.player, boxes: boards[0].initial.boxes.map(b => ({ ...b })) },
        { player: boards[1].initial.player, boxes: boards[1].initial.boxes.map(b => ({ ...b })) }
      ]
    }
  };
}

function key(state) {
  return state.worlds.map(w => {
    const bStr = w.boxes
      .map(b => `${b.pos}:${b.color}`)
      .sort()
      .join(',');
    return `${w.player}|${bStr}`;
  }).join('||');
}

function localIntent(board, world, dir, options = {}, side = 0) {
  const p = world.player;
  const dest = board.neighbors[p]?.[dir] ?? -1;
  if (dest === -1) {
    return { type: 'blocked', reason: 'wall' };
  }

  const boxAtDest = world.boxes.find(b => b.pos === dest);
  if (!boxAtDest) {
    return {
      type: 'walk',
      playerNext: dest,
      boxesNext: world.boxes.map(b => ({ ...b })),
      pushed: false,
      synthesis: null
    };
  }

  const beyond = board.neighbors[dest]?.[dir] ?? -1;
  if (beyond === -1) {
    return { type: 'blocked', reason: 'box_into_wall' };
  }

  // Scheme C: Prism Dispersion
  if (board.prisms && board.prisms.has(beyond) && boxAtDest.color === COLOR_PURPLE) {
    if (options.noPrism) {
      return { type: 'blocked', reason: 'noPrism' };
    }

    if (world.boxes.some(b => b.pos === beyond)) {
      return { type: 'blocked', reason: 'prism_occupied' };
    }

    let lat1, lat2;
    if (dir === 0 || dir === 1) {
      lat1 = board.neighbors[beyond]?.[2] ?? -1; // West
      lat2 = board.neighbors[beyond]?.[3] ?? -1; // East
    } else {
      lat1 = board.neighbors[beyond]?.[0] ?? -1; // North
      lat2 = board.neighbors[beyond]?.[1] ?? -1; // South
    }

    if (lat1 === -1 || lat2 === -1) {
      return { type: 'blocked', reason: 'prism_flank_wall' };
    }
    if (world.boxes.some(b => b.pos === lat1 || b.pos === lat2)) {
      return { type: 'blocked', reason: 'prism_flank_box' };
    }
    if (board.gates[lat1] && !gateAllowsColor(board.gates[lat1], COLOR_RED)) {
      return { type: 'blocked', reason: 'prism_flank_gate_red' };
    }
    if (board.gates[lat2] && !gateAllowsColor(board.gates[lat2], COLOR_BLUE)) {
      return { type: 'blocked', reason: 'prism_flank_gate_blue' };
    }

    return {
      type: 'prism_dispersion',
      playerNext: dest,
      pushed: true,
      box: boxAtDest,
      beyond,
      latRed: lat1,
      latBlue: lat2,
      synthesis: null
    };
  }

  // Scheme B: Push into Conduit
  const cLink = board.conduits?.get ? board.conduits.get(beyond) : board.conduits?.[beyond];
  if (cLink) {
    if (options.noConduit) {
      return { type: 'blocked', reason: 'noConduit' };
    }

    return {
      type: 'conduit_push',
      playerNext: dest,
      pushed: true,
      box: boxAtDest,
      fromSide: side,
      fromPos: beyond,
      toSide: cLink.otherSide,
      toPos: cLink.otherPos,
      outputSide: cLink.outputSide,
      synthesis: null
    };
  }

  // Normal push or Same-world synthesis
  const gateBeyond = board.gates[beyond];
  const boxAtBeyond = world.boxes.find(b => b.pos === beyond);

  if (boxAtBeyond) {
    if (options.noSynthesis) {
      return { type: 'blocked', reason: 'noSynthesis' };
    }

    const c1 = boxAtDest.color;
    const c2 = boxAtBeyond.color;
    const isRedBlue = (c1 === COLOR_RED && c2 === COLOR_BLUE) || (c1 === COLOR_BLUE && c2 === COLOR_RED);

    if (isRedBlue) {
      if (gateBeyond === 'r' || gateBeyond === 'b') {
        return { type: 'blocked', reason: 'gate_blocks_purple' };
      }

      const newBoxes = world.boxes
        .filter(b => b.id !== boxAtDest.id)
        .map(b => {
          if (b.id === boxAtBeyond.id) {
            return { ...b, color: COLOR_PURPLE };
          }
          return { ...b };
        });

      return {
        type: 'same_world_synthesis',
        playerNext: dest,
        boxesNext: newBoxes,
        pushed: true,
        box: boxAtDest,
        boxBeyond: boxAtBeyond,
        beyond,
        synthesis: {
          type: 'synthesis',
          boardIndex: side,
          pos: beyond,
          consumedId: boxAtDest.id,
          targetId: boxAtBeyond.id,
          resultingColor: COLOR_PURPLE,
          color: COLOR_PURPLE
        }
      };
    } else {
      return { type: 'blocked', reason: 'same_color_collision' };
    }
  }

  if (!gateAllowsColor(gateBeyond, boxAtDest.color)) {
    return { type: 'blocked', reason: 'gate_blocks_color' };
  }

  const newBoxes = world.boxes.map(b => {
    if (b.id === boxAtDest.id) {
      return { ...b, pos: beyond };
    }
    return { ...b };
  });

  return {
    type: 'normal_push',
    playerNext: dest,
    boxesNext: newBoxes,
    pushed: true,
    box: boxAtDest,
    beyond,
    synthesis: null
  };
}

function step(config, state, inputChar, options = {}) {
  const d = DIRS.indexOf(inputChar);
  if (d === -1) throw Error(`Unknown direction '${inputChar}'`);

  const d0 = d;
  const d1 = config.mapping[d];

  const plan0 = localIntent(config.boards[0], state.worlds[0], d0, options, 0);
  const plan1 = localIntent(config.boards[1], state.worlds[1], d1, options, 1);

  let accepted0 = plan0.type !== 'blocked';
  let accepted1 = plan1.type !== 'blocked';

  let pushed0 = Boolean(plan0.pushed);
  let pushed1 = Boolean(plan1.pushed);

  let synth0 = plan0.synthesis || null;
  let synth1 = plan1.synthesis || null;

  let disp0 = null;
  let disp1 = null;

  const transits = [];

  let maxBoxId = 0;
  for (const w of state.worlds) {
    for (const b of w.boxes) {
      if (b.id > maxBoxId) maxBoxId = b.id;
    }
  }

  const nextWorlds = [
    { player: state.worlds[0].player, boxes: state.worlds[0].boxes.map(b => ({ ...b })) },
    { player: state.worlds[1].player, boxes: state.worlds[1].boxes.map(b => ({ ...b })) }
  ];

  const cp0 = plan0.type === 'conduit_push' ? plan0 : null;
  const cp1 = plan1.type === 'conduit_push' ? plan1 : null;

  if (cp0 && cp1 && cp0.toSide === 1 && cp0.toPos === cp1.fromPos && cp1.toSide === 0 && cp1.toPos === cp0.fromPos) {
    // Case B.1: Synchronized head-on conduit collision
    const isRedBlue = (cp0.box.color === COLOR_RED && cp1.box.color === COLOR_BLUE) ||
                      (cp0.box.color === COLOR_BLUE && cp1.box.color === COLOR_RED);
    if (isRedBlue && !options.noSynthesis) {
      const outSide = cp0.outputSide ?? 0;
      const outPos = outSide === 0 ? cp0.fromPos : cp1.fromPos;
      const gateOut = config.boards[outSide].gates[outPos];

      if (gateAllowsColor(gateOut, COLOR_PURPLE)) {
        accepted0 = true;
        accepted1 = true;
        pushed0 = true;
        pushed1 = true;

        const consumedSide = 1 - outSide;
        const synthEvent = {
          type: 'conduit_collision',
          fromSide: consumedSide,
          toSide: outSide,
          fromPos: consumedSide === 0 ? cp0.fromPos : cp1.fromPos,
          toPos: outPos,
          resultingColor: COLOR_PURPLE,
          color: COLOR_PURPLE
        };
        synth0 = synthEvent;
        synth1 = synthEvent;

        nextWorlds[0].player = cp0.playerNext;
        nextWorlds[1].player = cp1.playerNext;

        nextWorlds[outSide].boxes = state.worlds[outSide].boxes.map(b => {
          if (b.id === (outSide === 0 ? cp0.box.id : cp1.box.id)) {
            return { ...b, pos: outPos, color: COLOR_PURPLE };
          }
          return { ...b };
        });

        nextWorlds[consumedSide].boxes = state.worlds[consumedSide].boxes
          .filter(b => b.id !== (consumedSide === 0 ? cp0.box.id : cp1.box.id))

 byId('rules').textContent=isPit?'两侧同向、独立移动。箱子填坑后消失，坑变路，对界同字母位置升柱；升柱处被占则填坑受阻。剩余箱子必须全部覆盖目标。':'红＋蓝相撞合成紫箱；颜色门只允许同色箱，人物自由通过。紫箱推入 ▲ 分光：纵向推入红左蓝右，横向推入红上蓝下。配对 ◇ 运输箱子；所有目标被覆盖即完成。';
 byId('steps').textContent='当前步数 '+s.steps;
 byId('reference').textContent='参考解步数 '+s.level.solutionLength;
 byId('status').textContent=s.level.id==='dv-06'?' · 待重做：当前版本可绕过填坑':s.solved?' · 已完成':s.playing?' · 演示中':'';
 byId('status').className=s.solved?'success':'';
 byId('design').textContent=s.level.design.decision+' '+s.level.design.space+' '+s.level.design.difference;
 document.querySelectorAll('#levels button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===s.index)));
 byId('boards').replaceChildren();
 s.config.boards.forEach((board,side)=>{
  if(!isPit&&side===1&&board.floor.length===1&&board.goals.length===0&&s.state.worlds[1].boxes.length===0)return;
  const card=document.createElement('div');card.className='board';
  const label=document.createElement('h3');label.textContent=side===0?'世界 A':'世界 B';card.append(label);
  const grid=document.createElement('div');grid.className='grid';grid.setAttribute('aria-label',label.textContent+' 棋盘');
  const size=Math.min(36,Math.floor((window.innerWidth-58)/board.width)-2);
  grid.style.setProperty('--cell',size+'px');grid.style.gridTemplateColumns='repeat('+board.width+',var(--cell))';
  const w=s.state.worlds[side],player=isPit?w[0]:w.player;
  const boxes=isPit?w.slice(1).map(pos=>({pos,color:0})):w.boxes;
  for(let y=0;y<board.height;y++)for(let x=0;x<board.width;x++){
    const pos=y*board.width+x,cell=document.createElement('div');cell.className='cell';let desc='地板';
    if(s.level.boards[side][y][x]==='#'){cell.classList.add('wall');desc='墙';}
    if(board.goals.includes(pos)){cell.classList.add('goal');desc='目标';}
    if(isPit){s.config.pairs.forEach((pair,i)=>{
      if(pair.pit.side===side&&pair.pit.pos===pos){cell.classList.add(s.state.filledPits[i]?'planned':'pit');cell.textContent=pair.id;desc=s.state.filledPits[i]?'已填坑':'坑';}
      if(pair.pillar.side===side&&pair.pillar.pos===pos){cell.classList.add(s.state.filledPits[i]?'pillar':'planned');cell.textContent=pair.id;desc=s.state.filledPits[i]?'柱子':'立柱预定点';}
    });}else{
      if(board.gates[pos]){cell.classList.add('gate-'+board.gates[pos]);cell.textContent={r:'红',b:'蓝',p:'紫'}[board.gates[pos]];desc=cell.textContent+'门';}
      if(board.prisms.has(pos)){cell.classList.add('prism');cell.textContent='▲';desc='棱镜';}
      if(board.conduits.has(pos)){cell.classList.add('conduit');cell.textContent='◇';desc='跨界端点';}
    }
    const box=boxes.find(b=>b.pos===pos);
    if(box||player===pos){const entity=document.createElement('span');const name=box?['普通箱','红箱','蓝箱','紫箱'][box.color]:'人物';entity.className='entity '+(box?['neutral','red','blue','purple'][box.color]:'player');entity.textContent=box?['箱','红','蓝','紫'][box.color]:'人';cell.append(entity);desc+=' · '+name;}
    cell.title=label.textContent+' ('+x+','+y+') '+desc;grid.append(cell);
  }
  card.append(grid);byId('boards').append(card);
 });
}
game=createGame(DATA.levels,engines,render);
DATA.levels.forEach((l,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+l.title;b.onclick=()=>select(i);byId('levels').append(b);});
function select(i){game.load(i);history.replaceState(null,'','#'+game.snapshot().level.id);}
byId('undo').onclick=()=>game.undo();byId('reset').onclick=()=>game.reset();byId('demo').onclick=()=>game.demo();byId('pause').onclick=()=>{game.stop();render();};byId('next').onclick=()=>select(game.snapshot().index+1);
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>game.move(b.dataset.dir));
window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const dir={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'}[e.key];if(dir){e.preventDefault();game.move(dir);}else if(e.key.toLowerCase()==='z')game.undo();else if(e.key.toLowerCase()==='r')game.reset();});
function fromHash(){const i=DATA.levels.findIndex(l=>'#'+l.id===location.hash);select(i<0?0:i);}
window.addEventListener('hashchange',fromHash);window.addEventListener('resize',render);window.addEventListener('pagehide',()=>game.stop());fromHash();
</script></body></html>
