    // Offline Micro-React Engine (Fallback for zero-network / local file:// double-click)
    (function () {
      if (typeof window.React !== 'undefined' && typeof window.ReactDOM !== 'undefined') {
        return;
      }
      let hooks = [];
      let hookIdx = 0;
      let rootVNode = null;
      let rootContainer = null;
      let renderScheduled = false;
      let activeEffects = [];

      function createElement(type, props, ...children) {
        const flat = [];
        function flatten(arr) {
          for (let i = 0; i < arr.length; i++) {
            const item = arr[i];
            if (Array.isArray(item)) flatten(item);
            else if (item !== null && item !== undefined && item !== false) flat.push(item);
          }
        }
        flatten(children);
        return { type, props: Object.assign({}, props || {}, { children: flat }) };
      }

      function useState(initial) {
        const idx = hookIdx++;
        if (hooks[idx] === undefined) {
          hooks[idx] = typeof initial === 'function' ? initial() : initial;
        }
        const setState = function (action) {
          const next = typeof action === 'function' ? action(hooks[idx]) : action;
          if (next !== hooks[idx]) {
            hooks[idx] = next;
            scheduleRender();
          }
        };
        return [hooks[idx], setState];
      }

      function useRef(initial) {
        const idx = hookIdx++;
        if (hooks[idx] === undefined) {
          hooks[idx] = { current: initial };
        }
        return hooks[idx];
      }

      function useMemo(factory, deps) {
        const idx = hookIdx++;
        const prev = hooks[idx];
        if (prev && deps && prev.deps && deps.length === prev.deps.length && deps.every((d, i) => d === prev.deps[i])) {
          return prev.value;
        }
        const value = factory();
        hooks[idx] = { value, deps };
        return value;
      }

      function useCallback(fn, deps) {
        return useMemo(() => fn, deps);
      }

      function useEffect(effect, deps) {
        const idx = hookIdx++;
        const prev = hooks[idx];
        const changed = !prev || !deps || !prev.deps || deps.length !== prev.deps.length || deps.some((d, i) => d !== prev.deps[i]);
        if (changed) {
          hooks[idx] = { effect, deps, cleanup: prev ? prev.cleanup : null };
          activeEffects.push(hooks[idx]);
        }
      }

      function scheduleRender() {
        if (!renderScheduled) {
          renderScheduled = true;
          (window.requestAnimationFrame || window.setTimeout)(performRender, 0);
        }
      }

      function performRender() {
        renderScheduled = false;
        if (!rootContainer || !rootVNode) return;
        hookIdx = 0;
        const effectsToRun = [];
        activeEffects = effectsToRun;
        const vdom = renderVNode(rootVNode);
        if (rootContainer && vdom) {
          const newDom = createRealDom(vdom);
          if (rootContainer.replaceChildren) {
            rootContainer.replaceChildren(newDom);
          } else {
            rootContainer.innerHTML = '';
            rootContainer.appendChild(newDom);
          }
        }
        for (let i = 0; i < effectsToRun.length; i++) {
          const ef = effectsToRun[i];
          if (typeof ef.cleanup === 'function') {
            try { ef.cleanup(); } catch (e) { console.error(e); }
          }
          try { ef.cleanup = ef.effect(); } catch (e) { console.error(e); }
        }
      }

      function renderVNode(vnode) {
        if (vnode === null || vnode === undefined || vnode === false) return null;
        if (typeof vnode !== 'object') return String(vnode);
        if (typeof vnode.type === 'function') {
          return renderVNode(vnode.type(vnode.props));
        }
        const children = (vnode.props.children || []).map(renderVNode).filter((c) => c !== null);
        return { type: vnode.type, props: vnode.props, children };
      }

      function createRealDom(vnode) {
        if (typeof vnode === 'string' || typeof vnode === 'number') {
          return document.createTextNode(String(vnode));
        }
        const el = document.createElement(vnode.type);
        const props = vnode.props || {};
        for (const key in props) {
          if (key === 'children') continue;
          const value = props[key];
          if (key === 'className') {
            el.className = value;
          } else if (key === 'style' && typeof value === 'object') {
            Object.assign(el.style, value);
          } else if (key.startsWith('on') && typeof value === 'function') {
            el.addEventListener(key.slice(2).toLowerCase(), value);
          } else if (key === 'disabled') {
            el.disabled = Boolean(value);
          } else if (key !== 'key') {
            el.setAttribute(key, value);
          }
        }
        for (let i = 0; i < (vnode.children || []).length; i++) {
          el.appendChild(createRealDom(vnode.children[i]));
        }
        return el;
      }

      window.React = { createElement, useState, useRef, useMemo, useCallback, useEffect };
      window.ReactDOM = {
        render: function (element, container) {
          rootVNode = element;
          rootContainer = container;
          performRender();
        }
      };
      console.log('[MirrorSokoban] Offline Micro-React active.');
    })();
  </script>

          button.title = info.titles[i] || number;
          button.setAttribute('aria-label', number + ' · ' + button.title);
        });

      if (nav) navObserver.observe(nav, { childList:true, subtree:true });

      const sizeObserver = new frame.contentWindow.ResizeObserver(resize);
      sizeObserver.observe(doc.querySelector('main')); resize();
      frame.contentWindow.addEventListener('pagehide', () => { navObserver.disconnect(); sizeObserver.disconnect(); }, { once:true });
      frame.contentWindow.focus();
